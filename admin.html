<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Panel administrador - Comunión Alejandro</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;

      font-family: Arial, sans-serif;

      background:
        linear-gradient(
          rgba(248,244,235,0.80),
          rgba(248,244,235,0.88)
        ),
        url("fondo comunion.jpg");

      background-size: cover;
      background-position: center;

      color: #35566d;
    }

    .login-card {
      width: min(440px, 94vw);
      padding: 42px 32px;

      background: rgba(255,253,248,0.94);

      border: 1px solid rgba(180,157,112,0.25);
      border-radius: 24px;

      box-shadow:
        0 20px 50px rgba(55,48,39,0.16);

      text-align: center;
    }

    .lock {
      font-size: 32px;
      margin-bottom: 18px;
    }

    .small-title {
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #8b7353;
      margin-bottom: 12px;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: 36px;
      font-weight: 400;
      color: #315d78;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #77716a;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 18px;
      text-align: left;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;

      font-size: 11px;
      letter-spacing: 1.3px;

      color: #8b7353;
    }

    .form-group input {
      width: 100%;

      padding: 14px 15px;

      border: 1px solid #d9cebc;
      border-radius: 10px;

      background: #eee8dc;

      font-size: 15px;
      color: #3f4b53;

      outline: none;
    }

    .form-group input:focus {
      border-color: #6f8ea3;

      box-shadow:
        0 0 0 3px rgba(111,142,163,0.12);
    }

    .login-button {
      width: 100%;
      margin-top: 6px;

      padding: 15px 20px;

      border: none;
      border-radius: 999px;

      background: #4d7087;

      color: white;

      font-size: 15px;
      font-weight: 600;

      cursor: pointer;
    }

    .login-button:hover {
      background: #3f6177;
    }

    .login-button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .login-message {
      min-height: 22px;
      margin-top: 16px;

      font-size: 13px;
      color: #a04f46;
    }

    .back-link {
      display: inline-block;
      margin-top: 22px;

      color: #70808b;
      text-decoration: none;
      font-size: 13px;
    }

  </style>

</head>

<body>

  <main class="login-card">

    <div class="lock">🔒</div>

    <p class="small-title">
      ÁREA PRIVADA
    </p>

    <h1>
      Gestión del evento
    </h1>

    <p class="subtitle">
      Acceso exclusivo para la familia de Alejandro
    </p>

    <form id="adminLoginForm">

      <div class="form-group">

        <label for="adminEmail">
          EMAIL
        </label>

        <input
          type="email"
          id="adminEmail"
          placeholder="administrador@email.com"
          required
        >

      </div>

      <div class="form-group">

        <label for="adminPassword">
          CONTRASEÑA
        </label>

        <input
          type="password"
          id="adminPassword"
          placeholder="Tu contraseña"
          required
        >

      </div>

      <button
        type="submit"
        class="login-button"
        id="loginButton"
      >
        Entrar al panel
      </button>

      <p
        id="loginMessage"
        class="login-message"
      ></p>

    </form>

    <a
      href="index.html"
      class="back-link"
    >
      ← Volver a la invitación
    </a>

  </main>


  <script>

    const SUPABASE_URL =
      "https://txqqzyguzhvtfdmyzkfj.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_msKobPJLUTjtLZx8ut9Cxg_894X6lxk";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const loginForm =
      document.getElementById("adminLoginForm");

    const loginButton =
      document.getElementById("loginButton");

    const loginMessage =
      document.getElementById("loginMessage");


    loginForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        const email =
          document.getElementById("adminEmail").value.trim();

        const password =
          document.getElementById("adminPassword").value;


        loginButton.disabled = true;
        loginButton.textContent = "Comprobando...";

        loginMessage.textContent = "";


        const { data, error } =
          await supabaseClient.auth.signInWithPassword({
            email,
            password
          });


        if (error) {

          console.error(error);

          loginMessage.textContent =
            "Email o contraseña incorrectos.";

          loginButton.disabled = false;
          loginButton.textContent = "Entrar al panel";

          return;
        }


        window.location.href =
          "panel.html";

      }
    );

  </script>

</body>

</html>
