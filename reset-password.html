<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cambiar contraseña - Comunión Francisco Javier</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 20px;
    }

    .reset-card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.10);
    }

    h1 {
      margin-top: 0;
      text-align: center;
      color: #2f4f6f;
    }

    p {
      text-align: center;
      color: #666;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 6px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #2f4f6f;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.92;
    }

    #status {
      margin-top: 18px;
      text-align: center;
      font-weight: bold;
    }

    .success {
      color: #2f7d32;
    }

    .error {
      color: #b42318;
    }
  </style>
</head>

<body>

  <div class="reset-card">

    <h1>Nueva contraseña</h1>

    <p>
      Introduce tu nueva contraseña para acceder al panel de gestión
      de la Comunión de Francisco Javier.
    </p>

    <form id="resetForm">

      <label for="password">
        Nueva contraseña
      </label>

      <input
        type="password"
        id="password"
        required
        minlength="6"
      >

      <label for="confirmPassword">
        Repetir contraseña
      </label>

      <input
        type="password"
        id="confirmPassword"
        required
        minlength="6"
      >

      <button type="submit">
        Guardar nueva contraseña
      </button>

      <div id="status"></div>

    </form>

  </div>

  <script>

    const SUPABASE_URL =
      "https://tzamhyfndehqvpyffuhp.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_EnQWhpZV0LG4N4ap-yoh7w_rrXaXSfE";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    const resetForm =
      document.getElementById("resetForm");

    const status =
      document.getElementById("status");

    resetForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        const password =
          document
            .getElementById("password")
            .value;

        const confirmPassword =
          document
            .getElementById("confirmPassword")
            .value;

        status.textContent = "";
        status.className = "";

        if (password !== confirmPassword) {
          status.textContent =
            "Las contraseñas no coinciden.";
          status.className = "error";
          return;
        }

        if (password.length < 6) {
          status.textContent =
            "La contraseña debe tener al menos 6 caracteres.";
          status.className = "error";
          return;
        }

        const { error } =
          await supabaseClient.auth.updateUser({
            password: password
          });

        if (error) {
          console.error(
            "Error actualizando contraseña:",
            error
          );

          status.textContent =
            "No se pudo cambiar la contraseña. Vuelve a abrir el enlace del correo.";
          status.className = "error";
          return;
        }

        status.textContent =
          "Contraseña cambiada correctamente.";
        status.className = "success";

        setTimeout(() => {
          window.location.href = "admin.html";
        }, 2000);
      }
    );

  </script>

</body>
</html>
